name: NeonixEditor
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

targets:
  NeonixEditor:
    type: application
    platform: iOS
    sources:
      - path: apps/ios-editor/Sources/AppModule
        excludes:
          - Resources
      - path: apps/ios-editor/Sources/AppModule/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonix.editor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ENABLE_PREVIEWS: "YES"
    info:
      path: Generated-Info.plist
      properties: {}

  NeonixEditorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: apps/ios-editor/Tests/AppModuleTests
    dependencies:
      - target: NeonixEditor
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"

  NeonixEditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: apps/ios-editor/UITests
    dependencies:
      - target: NeonixEditor
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: NeonixEditor

schemes:
  NeonixEditor:
    build:
      targets:
        NeonixEditor: all
        NeonixEditorTests: [test]
        NeonixEditorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeonixEditorTests
        - NeonixEditorUITests
