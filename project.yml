name: NeonixEditor
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0

targets:
  NeonixEditor:
    type: application
    platform: iOS
    sources:
      - path: ios-editor/Sources/AppModule
        excludes:
          - Resources
      - path: ios-editor/Sources/AppModule/Resources
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        products:
          - GoogleSignIn
          - GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonix.editor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ios-editor/NeonixEditor.entitlements
        DEVELOPMENT_TEAM: 5BZL4WMZ53
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Neonix needs access to import photos and videos into your projects."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Neonix saves your exported videos to Photos."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Cho phép truy cập micro để ghi âm giọng nói vào video"
        ENABLE_PREVIEWS: "YES"
        GOOGLE_IOS_CLIENT_ID: "949351619628-i2krfh34ngj8lfdarm9qqubtmlhhihrv.apps.googleusercontent.com"
        GOOGLE_WEB_CLIENT_ID: "949351619628-atvncosdpv65q5c0gdg67oaf0kggmfdi.apps.googleusercontent.com"
        GOOGLE_IOS_URL_SCHEME: "com.googleusercontent.apps.949351619628-i2krfh34ngj8lfdarm9qqubtmlhhihrv"
    info:
      path: Generated-Info.plist
      properties:
        GIDClientID: "$(GOOGLE_IOS_CLIENT_ID)"
        GIDServerClientID: "$(GOOGLE_WEB_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(GOOGLE_IOS_URL_SCHEME)"

  NeonixEditorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios-editor/Tests/AppModuleTests
    dependencies:
      - target: NeonixEditor
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.neonix.editor.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5BZL4WMZ53

  NeonixEditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios-editor/UITests
    dependencies:
      - target: NeonixEditor
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: NeonixEditor
        PRODUCT_BUNDLE_IDENTIFIER: com.neonix.editor.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5BZL4WMZ53

schemes:
  NeonixEditor:
    build:
      targets:
        NeonixEditor: all
        NeonixEditorTests: [test]
        NeonixEditorUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: ios-editor/StoreKit/Credits.storekit
    test:
      config: Debug
      targets:
        - NeonixEditorTests
        - NeonixEditorUITests
